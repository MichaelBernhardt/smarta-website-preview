<!DOCTYPE html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Smarta social card source</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body {
        position: relative;
        color: #fff;
        font-family: "Avenir Next", Avenir, "Segoe UI", Arial, sans-serif;
        background: #042f49 url("../images/installations/solar-borehole-installation-2026-06-11.jpg") 58% center / cover;
      }
      body::before {
        position: absolute;
        inset: 0;
        content: "";
        background:
          linear-gradient(90deg, rgba(3, 31, 49, .99) 0%, rgba(3, 31, 49, .93) 45%, rgba(3, 31, 49, .5) 70%, rgba(3, 31, 49, .12)),
          linear-gradient(0deg, rgba(3, 31, 49, .45), transparent 52%);
      }
      .content {
        position: relative;
        z-index: 2;
        width: 720px;
        padding: 54px 0 0 64px;
      }
      .logo {
        width: 190px;
        height: 96px;
        object-fit: contain;
        object-position: left center;
        filter: brightness(0) invert(1);
      }
      .eyebrow {
        margin: 42px 0 20px;
        color: #7ce2eb;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: .18em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 640px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 76px;
        font-weight: 400;
        letter-spacing: -.045em;
        line-height: .94;
      }
      h1 span { color: #54d3df; }
      p {
        max-width: 665px;
        margin: 23px 0 0;
        color: rgba(235,247,250,.77);
        font-size: 19px;
        line-height: 1.55;
      }
      .proof {
        position: absolute;
        z-index: 2;
        right: 64px;
        bottom: 43px;
        padding-top: 12px;
        border-top: 1px solid rgba(255,255,255,.55);
        color: rgba(255,255,255,.82);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .04em;
      }
    </style>
  </head>
  <body>
    <main class="content">
      <img class="logo" src="../images/brand/smarta-official-logo-260.png" alt="Smarta">
      <div class="eyebrow">Remote monitoring &amp; automated pump control</div>
      <h1>Your water system, <span>under control.</span></h1>
      <p>For estates, mines, farms and municipalities.</p>
    </main>
    <div class="proof">11 years · 400+ active sites · South African developed</div>
  </body>
</html>
